<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 480" role="img" aria-labelledby="flow-title flow-desc" xmlns="http://www.w3.org/2000/svg">
            <title id="flow-title">Request flow through Statera Forge</title>
            <desc id="flow-desc">Randomly generated requests pass through an IP range blocker. Blocked requests are counted and rejected. Accepted requests enter a FIFO queue. The load balancer assigns queued requests to three representative web servers. Completed requests contribute to statistics and a final summary. The load balancer owns the queue and servers. Each server becomes available after completing a request. A scaling policy adjusts the pool based on queue size.</desc>
            <style>:root{--iron:#292522;--copper:#9c4a27;--bright-copper:#c66b3d;--brass:#d8ae67;--cream:#f5f0e8;--paper:#fcfaf6;--line:#d9cfc1;--muted:#686056}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--iron);font-family:Arial,Helvetica,sans-serif;line-height:1.8}.skip{position:absolute;top:-100px;left:20px;background:var(--paper);padding:10px 20px;color:var(--copper)}.skip:focus{top:10px;z-index:2}.masthead{background:var(--iron);color:var(--cream);border-bottom:3px solid var(--bright-copper);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 6vw}.brand{font-size:18px;font-weight:bold;letter-spacing:3px;white-space:nowrap}.brand span{font-size:.75em;letter-spacing:4px;color:var(--brass)}.project{font:10px/1.6 Consolas,'Liberation Mono',monospace;letter-spacing:1.2px}main{max-width:1120px;margin:auto;padding:0 55px 55px}.intro{display:grid;grid-template-columns:1fr 260px;align-items:center;gap:40px;padding:38px 0 35px;border-bottom:1px solid var(--line);margin-bottom:36px}.intro img{width:100%;height:auto;mix-blend-mode:multiply}.eyebrow{font:10px/1.7 Consolas,'Liberation Mono',monospace;letter-spacing:1.5px;color:var(--copper);font-weight:bold;margin:0 0 12px}h1,h2{font-family:Georgia,'Times New Roman',serif;font-weight:normal;line-height:1.2}h1{font-size:43px;letter-spacing:-1.2px;margin:0 0 16px}h2{font-size:28px;letter-spacing:-.5px;margin:0 0 22px}.lead{max-width:510px;color:var(--muted);font-size:15px;margin:0}section+section{margin-top:36px}.diagram{margin:0;background:var(--paper);border:1px solid var(--line);padding:18px}.diagram-scroll{overflow-x:auto}.diagram svg{display:block;width:100%;height:auto}figcaption{border-top:1px solid var(--line);margin-top:12px;padding:12px 2px 0;font-size:11px;color:var(--muted);line-height:1.65}figcaption span{font:10px Consolas,'Liberation Mono',monospace;color:var(--copper);margin-right:9px}.svg-box{fill:#fcfaf6;stroke:#b9ab98;stroke-width:1.4}.svg-dark{fill:#292522}.svg-reject{fill:#f2e2d9;stroke:#b37554;stroke-width:1.2}.flow-line{stroke:#9c4a27;stroke-width:2;fill:none}.dashed{stroke-dasharray:5 4}.svg-title{text-anchor:middle;font:600 13px Arial,sans-serif;fill:#292522}.svg-small{text-anchor:middle;font:11px Arial,sans-serif;fill:#686056}.svg-label{text-anchor:middle;font:9px Consolas,monospace;fill:#9c4a27}.svg-light{fill:#fcfaf6}.description{border-top:1px solid var(--line);padding-top:30px}.description p:not(.eyebrow){font-size:16px;line-height:1.75;max-width:75ch;margin:0 0 18px}.description p:last-child{margin-bottom:0}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--iron);color:var(--cream);padding:24px 6vw}footer>span:last-child{font:italic 14px Georgia,'Times New Roman',serif;color:#d8cabc}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#9c4a27"/></marker></defs>
            <g class="flow-line" marker-end="url(#arrow)"><path d="M181 151H224"/><path d="M383 151H426"/><path d="M591 151H634"/><path d="M303 120V53H182"/><path d="M714 181V218H160V272"/><path d="M714 218H450V272"/><path d="M714 218H740V272"/><path d="M160 335V383H450V411"/><path d="M450 335V411"/><path d="M740 335V383H450" marker-end="none"/></g>
            <rect x="23" y="120" width="158" height="62" rx="6" class="svg-box"/><text x="102" y="145" class="svg-title">Request generator</text><text x="102" y="165" class="svg-small">IP in/out · time · P/S</text>
            <rect x="224" y="120" width="159" height="62" rx="6" class="svg-box"/><text x="303" y="145" class="svg-title">IP range blocker</text><text x="303" y="165" class="svg-small">Check source IP</text>
            <rect x="426" y="120" width="165" height="62" rx="6" class="svg-box"/><text x="508" y="145" class="svg-title">Request queue</text><text x="508" y="165" class="svg-small">FIFO · waiting jobs</text>
            <rect x="634" y="120" width="160" height="62" rx="6" class="svg-dark"/><text x="714" y="145" class="svg-title svg-light">Load balancer</text><text x="714" y="165" class="svg-small svg-light">Owns queue &amp; servers</text>
            <text x="405" y="140" class="svg-label">PASS</text><text x="337" y="92" class="svg-label">BLOCK</text>
            <rect x="23" y="26" width="158" height="54" rx="6" class="svg-reject"/><text x="102" y="49" class="svg-title">Reject &amp; count</text><text x="102" y="68" class="svg-small">Never enter the queue</text>
            <rect x="85" y="273" width="150" height="62" rx="6" class="svg-box"/><text x="160" y="298" class="svg-title">Web server 1</text><text x="160" y="319" class="svg-small">One job; then ready again</text>
            <rect x="375" y="273" width="150" height="62" rx="6" class="svg-box"/><text x="450" y="298" class="svg-title">Web server 2</text><text x="450" y="319" class="svg-small">One job; then ready again</text>
            <rect x="665" y="273" width="150" height="62" rx="6" class="svg-box"/><text x="740" y="298" class="svg-title">Web server N</text><text x="740" y="319" class="svg-small">One job; then ready again</text>
            <rect x="554" y="26" width="300" height="54" rx="6" class="svg-box"/><text x="704" y="49" class="svg-title">Scaling policy</text><text x="704" y="68" class="svg-small">Queue size + cooldown → pool size</text><path d="M714 80V115" class="flow-line dashed" marker-end="url(#arrow)"/>
            <rect x="294" y="412" width="312" height="50" rx="6" class="svg-dark"/><text x="450" y="442" class="svg-title svg-light">Completed requests → logs &amp; summary</text>
          </svg>